<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AP_Phase10</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>AP_Phase10</h1>
  <form id="connect" autocomplete="off">
    <input id="url" value="archipelago.gg:38281" size="22" aria-label="Server">
    <input id="slot" placeholder="Slot name" size="14" aria-label="Slot name">
    <input id="password" type="password" placeholder="Password" size="12" aria-label="Password">
    <button type="submit" id="connect-button">Connect</button>
    <span id="status" role="status">not connected</span>
  </form>
</header>

<main>
  <section id="summary" aria-live="polite"></section>
  <section id="objective"></section>
  <section id="stats"></section>

  <div id="table-wrap" hidden>
    <h2>The table <small>they race you to go out</small></h2>
    <div id="table"></div>
  </div>

  <div id="mine-wrap" hidden>
    <h2>Your phase <small>click a group to play onto it</small></h2>
    <div id="mine"></div>
  </div>

  <h2>Your hand <small>click a card to discard it</small></h2>
  <div id="hand" class="cards"></div>

  <div id="dig" hidden>
    <h2>Keep one</h2>
    <div id="dig-cards" class="cards"></div>
  </div>

  <div id="actions">
    <button data-action="draw">Draw</button>
    <button data-action="draw-discard">Take discard</button>
    <button data-action="lay">Lay down</button>
    <button data-action="skip">Dig (Skip)</button>
    <button data-action="mulligan" id="mulligan-button">Mulligan</button>
  </div>

  <h2>Phases</h2>
  <div id="phases"></div>

  <h2>Scorecard</h2>
  <pre id="scorecard"></pre>

  <h2>Log <small>your game and the rest of the room</small></h2>
  <div id="log" class="log" aria-live="polite"></div>
</main>

<script type="module" src="src/ui.js"></script>
</body>
</html>
