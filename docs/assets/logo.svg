<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="AP_10">
  <!-- Original mark for AP_10: a fanned hand in the deck's colours, the top
       card reading AP over 10. Drawn by hand as plain shapes; not derived
       from Archipelago's own logo. -->
  <g stroke="#ffffff" stroke-width="2.2" stroke-linejoin="round">
    <rect x="10" y="12" width="26" height="38" rx="5" fill="#ed333d" transform="rotate(-22 23 50)"/>
    <rect x="19" y="9" width="26" height="38" rx="5" fill="#1f78f5" transform="rotate(-8 32 47)"/>
    <rect x="28" y="12" width="26" height="38" rx="5" fill="#12b354" transform="rotate(10 41 50)"/>
    <rect x="19" y="14" width="26" height="40" rx="5" fill="#f8bd0a"/>
  </g>
  <text x="32" y="31" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-weight="900" font-size="11" fill="#17224a">AP</text>
  <text x="32" y="48" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-weight="900" font-size="15" fill="#17224a">10</text>
</svg>
